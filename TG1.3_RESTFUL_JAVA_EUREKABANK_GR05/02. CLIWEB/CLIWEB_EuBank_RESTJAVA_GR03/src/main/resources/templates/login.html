<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - EurekaBank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script th:inline="javascript">
        // Configuracion de Tailwind con los colores de EuBank REST
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'eubank-primary': '#F97316',
                        'eubank-secondary': '#EA580C',
                    }
                }
            }
        }
    </script>
    <style>
        /* Estilos para los iconos en los inputs */
        .form-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            z-index: 10;
        }
        .input-with-icon {
            position: relative;
        }
        .input-with-icon input {
            padding-left: 40px !important; /* !important para sobreescribir tailwind */
        }
    </style>
</head>
<body class="min-h-screen flex font-sans bg-gray-100">

    <div class="flex-1 flex items-center justify-center p-8">
        <div class="max-w-6xl w-full bg-white rounded-xl shadow-2xl overflow-hidden">
            <div class="flex flex-col md:flex-row">
                
                <div class="w-full md:w-1/2 flex items-center justify-center p-12 bg-gradient-to-r from-eubank-primary to-eubank-secondary">
                    <div class="flex flex-col items-center justify-center space-y-6 text-center">
                        <img th:src="@{/images/sulliLogo.png}" alt="EuBank Logo" class="w-64 h-auto drop-shadow-2xl">
                        <div class="text-center">
                            <h2 class="text-4xl font-extrabold text-white tracking-wide">EUREKABANK REST con Java</h2>
                            <p class="text-orange-100 text-base mt-2 font-medium">Tu banco de confianza</p>
                        </div>
                    </div>
                </div>

                <div class="w-full md:w-1/2 p-8 md:p-12">
                    <div class="text-center mb-8">
                        <img th:src="@{/images/EB-REST JAVA2.png}" alt="EuBank Logo" class="h-44 mx-auto">
                        <p class="text-gray-600">Sistema de Gestion Bancaria</p>
                    </div>

                    <div th:if="${error != null}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg mb-6" role="alert">
                        <strong class="font-bold">Error:</strong>
                        <span class="block sm:inline" th:text="${error}"></span>
                    </div>

                    <form method="post" th:action="@{/login}" class="space-y-6">
                        <div class="input-with-icon">
                            <span class="form-icon">👤</span>
                            <input type="text"
                                   name="usuario"
                                   placeholder="Usuario"
                                   required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-eubank-primary focus:border-transparent transition duration-200" />
                        </div>

                        <div class="input-with-icon">
                            <span class="form-icon">🔒</span>
                            <input type="password"
                                   name="clave"
                                   placeholder="Contraseña"
                                   required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-eubank-primary focus:border-transparent transition duration-200" />
                        </div>

                        <button type="submit"
                                class="w-full bg-gradient-to-r from-eubank-primary to-eubank-secondary text-white font-bold py-3 px-4 rounded-lg hover:shadow-lg transform hover:-translate-y-0.5 transition duration-200">
                            Iniciar Sesión
                        </button>
                    </form>

                    <div class="text-center mt-6">
                        <small class="text-gray-500">© 2025 EuBank - REST.JAVA Group 05</small>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
</html>
