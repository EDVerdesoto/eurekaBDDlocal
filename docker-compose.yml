services:
  mariadb:
    image: mariadb:10.11
    container_name: mariadb-global
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: eureka
      MYSQL_PASSWORD: admin
    ports:
      - "3306:3306"
    volumes:
      - mariadb_global_data:/var/lib/mysql
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "eureka", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql-dotnet
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "EurekaSql2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql_dotnet_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: mssql-dotnet-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      SA_PASSWORD: "EurekaSql2026!"
    volumes:
      - ./docker/mssql-init:/init:ro
    command: >
      bash -c '
      until /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P "$$SA_PASSWORD" -Q "SELECT 1"; do sleep 2; done;
      /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P "$$SA_PASSWORD" -i /init/00_init_dotnet.sql
      '
    restart: "no"

volumes:
  mariadb_global_data:
    driver: local
  mssql_dotnet_data:
    driver: local
